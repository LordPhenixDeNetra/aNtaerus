browser:
  enabled: true
  max_results: 5

gmail:
  enabled: true
  allow_send: false

calendar:
  enabled: true
  allow_create: false

weather:
  enabled: true
  geocoding_enabled: true

vision:
  enabled: true
  default_confidence: 0.25

filesystem:
  enabled: true
  # [INFO] PAR DEFAUT: AUCUN dossier personnel n'est autorise.
  #    Autorisez des dossiers via (par PRIORITE, la plus haute ecrase) :
  #     1. [UI] UI Parametres -> "Dossiers autorises" (RECOMMANDE pour utilisateur lambda)
  #        -> Persiste dans SQLite table user_preferences (antaerus_memory.db)
  #     2. [ENV] Variable ENV (deploiement / Docker / CI) :
  #        Windows: ANTAERUS_TOOLS_FS_ALLOWED_ROOTS=C:\Users\TOI\Musique;D:\Partages
  #        Linux/macOS: ANTAERUS_TOOLS_FS_ALLOWED_ROOTS=/home/toi/Musique:/srv/partages
  #        (Separateur UNIVERSEL tous OS: ;; )
  #     3. [DEV] Ce fichier tools.yaml (baseline developpeurs, push sur Git OK)
  allowed_roots:
    - docs
    - memory_data
    - providers/brain_python
  max_bytes: 65536

memory_tool:
  enabled: true
  default_category: notes

cli:
  enabled: true
  allowed_commands:
    - python
    - py
    - git
    - go
    - cargo
    - uv
    - npm
    - explorer
    - explorer.exe
    - vlc
    - vlc.exe
    - wmplayer
    - wmplayer.exe
    - msedge
    - msedge.exe
    - cmd
    - cmd.exe
    - powershell
    - powershell.exe
    - pwsh
    - pwsh.exe
    - start
    - rundll32
    - rundll32.exe
  timeout_seconds: 10
